version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Next's packages must move together or the build breaks.
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      gsap:
        patterns: ["gsap", "@gsap/react"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
